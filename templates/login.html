{% extends 'base.html' %}

{% block title %}Login | CampusClaim{% endblock %}

{% block content %}
<section class="form-page">
    <h1>Log in</h1>
    <form class="form" method="post">
        <label>
            Email
            <input type="email" name="email" required value="{{ request.form.get('email', '') }}">
        </label>
        <label>
            Password
            <input type="password" name="password" required>
        </label>
        <button class="button button-primary" type="submit">Login</button>
    </form>
</section>
{% endblock %}
