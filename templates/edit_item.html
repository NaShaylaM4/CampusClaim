{% extends 'base.html' %}

{% block title %}Edit Item | CampusClaim{% endblock %}

{% block content %}
<section class="form-page">
    <h1>Edit Item Report</h1>
    <form class="form" method="post">
        <label>
            Report Type
            <span>{{ item.report_type }}</span>
        </label>
        <label>
            Item Name / Title
            <input type="text" name="title" required value="{{ item.title }}">
        </label>
        <label>
            Category
            <select name="category" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                    <option value="{{ category }}" {% if item.category == category %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Description
            <textarea name="description" required>{{ item.description }}</textarea>
        </label>
        <label>
            Location
            <input type="text" name="location" required value="{{ item.location }}">
        </label>
        <label>
            Date Lost or Found
            <input type="date" name="date_lost_found" required value="{{ item.date_lost_found }}">
        </label>
        <label>
            Verification Question
            <textarea name="verification_question">{{ item.verification_question or '' }}</textarea>
        </label>
        <label>
            Status
            <span>{{ item.status }}</span>
        </label>
        <button class="button button-primary" type="submit">Save Changes</button>
    </form>
</section>
{% endblock %}
