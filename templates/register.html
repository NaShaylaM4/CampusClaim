{% extends 'base.html' %}

{% block title %}Register | CampusClaim{% endblock %}

{% block content %}
<section class="form-page">
    <h1>Create an account</h1>
    <form class="form" method="post">
        <label>
            First Name
            <input type="text" name="first_name" required value="{{ request.form.get('first_name', '') }}">
        </label>
        <label>
            Last Name
            <input type="text" name="last_name" required value="{{ request.form.get('last_name', '') }}">
        </label>
        <label>
            Email
            <input type="email" name="email" required value="{{ request.form.get('email', '') }}">
        </label>
        <label>
            Password
            <input type="password" name="password" required>
        </label>
        <label>
            Confirm Password
            <input type="password" name="confirm_password" required>
        </label>
        <button class="button button-primary" type="submit">Register</button>
    </form>
</section>
{% endblock %}
